<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="navbar d-md-none"></header>

    <div class="container-fluid">
        <div class="main-layout-container">
            
            <nav id="sidebarMenu" class="sidebar"></nav>

            <main class="content-workspace main-wrapper">
                <div class="max-w-content-pane">
                    
                    <div id="alertContainer"></div>

                    <form id="configForm" class="card-form">
                        
                        <!-- Sensor Configuration -->
                        <div class="card">
                            <div class="card-header">
                                <img src="/icons/laser.svg" class="card-header-icon" alt="Sensor Icon">
                                <h2 class="h6 m-0 fw-bold text-uppercase">Sensor</h2>
                            </div>
                            <div class="card-body">
                                <div class="g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label" for="sensorConfigMode">Config Mode</label>
                                        <input type="number" class="form-control" id="sensorConfigMode" min="0" max="255" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label" for="sensorHighAccuracyMode">High Accuracy Mode</label>
                                        <input type="number" class="form-control" id="sensorHighAccuracyMode" min="0" max="255" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Wi-Fi STA Configuration -->
                        <div class="card">
                            <div class="card-header">
                                <img src="/icons/wifi.svg" class="card-header-icon" alt="Wi-Fi STA Icon">
                                <h2 class="h6 m-0 fw-bold text-uppercase">Wi-Fi Station</h2>
                            </div>
                            <div class="card-body">
                                <div class="g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label" for="wifiSTASSID">SSID</label>
                                        <input type="text" class="form-control" id="wifiSTASSID" maxlength="31" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label" for="wifiSTAPassword">Password</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="wifiSTAPassword" maxlength="63">
                                            <button class="btn btn-outline-secondary toggle-pass-btn" type="button" data-toggle-target="wifiSTAPassword">
                                                <img src="/icons/eye.svg" alt="Toggle Password" style="width:16px; height:16px;">
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label" for="wifiSTADHCPEnabled">DHCP</label>
                                        <select class="form-select" id="wifiSTADHCPEnabled">
                                            <option value="true">Enabled</option>
                                            <option value="false">Disabled (Static IP)</option>
                                        </select>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label" for="wifiSTAStaticIP">Static IP Address</label>
                                        <input type="text" class="form-control" id="wifiSTAStaticIP" maxlength="15" pattern="^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Wi-Fi AP Configuration -->
                        <div class="card">
                            <div class="card-header">
                                <img src="/icons/router.svg" class="card-header-icon" alt="Wi-Fi AP Icon">
                                <h2 class="h6 m-0 fw-bold text-uppercase">Wi-Fi Access Point</h2>
                            </div>
                            <div class="card-body">
                                <div class="g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label" for="wifiAPSSID">AP SSID</label>
                                        <input type="text" class="form-control" id="wifiAPSSID" maxlength="31" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label" for="wifiAPPassword">AP Password</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="wifiAPPassword" maxlength="63">
                                            <button class="btn btn-outline-secondary toggle-pass-btn" type="button" data-toggle-target="wifiAPPassword">
                                                <img src="/icons/eye.svg" alt="Toggle Password" style="width:16px; height:16px;">
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-sm-4">
                                        <label class="form-label" for="wifiAPGateway">Gateway IP</label>
                                        <input type="text" class="form-control" id="wifiAPGateway" maxlength="15" required pattern="^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$">
                                    </div>
                                    <div class="col-sm-4">
                                        <label class="form-label" for="wifiAPNetmask">Subnet Mask</label>
                                        <input type="text" class="form-control" id="wifiAPNetmask" maxlength="15" required pattern="^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$">
                                    </div>
                                    <div class="col-sm-4">
                                        <label class="form-label" for="wifiAPDHCPEnabled">DHCP Server</label>
                                        <select class="form-select" id="wifiAPDHCPEnabled">
                                            <option value="true">Enabled</option>
                                            <option value="false">Disabled</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Scheduler Settings -->
                        <div class="card">
                            <div class="card-header">
                                <img src="/icons/schedule.svg" class="card-header-icon" alt="Scheduler Icon">
                                <h2 class="h6 m-0 fw-bold text-uppercase">Schedule</h2>
                            </div>
                            <div class="card-body">
                                <div class="g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label" for="schedulerIntervalSec">Interval (Seconds)</label>
                                        <input type="number" class="form-control" id="schedulerIntervalSec" min="1" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label" for="startDateTime">Start Date & Time</label>
                                        <input type="datetime-local" class="form-control" id="startDateTime" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Action Bar -->
                        <div class="card-footer-actions mb-3">
                            <button type="submit" class="btn btn-dark-edge">Save</button>
                        </div>

                    </form>

                </div>

                <footer class="card-footer"></footer>
            </main>

        </div>
    </div>
    <script src="/script.js"></script>
</body>
</html>
